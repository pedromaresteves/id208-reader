<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID208 Home</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<h1>Home</h1>
<section class="hero-card">
  <div class="section-head"><div><h2>Watch sync</h2><div id="lastSync" class="muted">Last sync: loading…</div></div><span class="chip">On this device</span></div>
  <button id="btnSync" class="btn-primary">Sync Data</button>
  <p class="btn-row"><button id="btnRefresh" class="btn-sec" title="Refresh" aria-label="Refresh">↻ Refresh</button>
  <button id="btnBackup" class="btn-sec">Backup store</button>
  <label for="fileImport" class="btn btn-sec">Import backup</label>
  <input id="fileImport" type="file" accept=".json,.jsonl,.csv" style="display:none;"></p>
  <p id="status" class="muted" aria-live="polite"></p>
  <p id="storeStatus" class="muted"></p>
  <div id="syncBarWrap"><span class="spinner" id="syncSpinner" style="display:none;"></span>
  <span id="syncLabel">Idle</span><div id="syncBarOuter"><div id="syncBarInner"></div></div></div>
</section>
<div class="dashboard-grid">
<section id="secSteps"><div class="section-head"><h2>Activity</h2><a class="go" href="activity.html">Open ›</a></div><div class="body muted">Loading…</div></section>
<section id="secSleep"><div class="section-head"><h2>Sleep</h2><a class="go" href="sleep.html">Open ›</a></div><div class="body muted">Loading…</div></section>
<section id="secHealth"><div class="section-head"><h2>Health</h2><a class="go" href="health.html">Open ›</a></div><div class="body muted">Loading…</div></section>
<section id="secWorkouts"><div class="section-head"><h2>Workouts</h2><a class="go" href="workout.html">Open ›</a></div><div class="body muted">Loading…</div></section>
</div>
<section id="secDebug"><h2>Diagnostics & data</h2><p class="muted">Settings, advanced recovery, and raw store data.</p><p class="btn-row"><a class="btn" href="watch.html">Watch settings</a><a class="btn" href="diagnostics.html">Diagnostics</a></p><details><summary>Show raw store JSON</summary><pre id="debugDump" class="debug-dump"></pre></details></section>

<script>
// Load local scripts with the page's cache-bust token (?v=<epoch>). The skew
// banner's Force reload uses the same mechanism, so stale Chrome profiles
// cannot keep serving an old module.
(function () {
  var m = location.search.match(/[?&]v=([^&]+)/);
  var q = m ? '?v=' + m[1] : '';
  ['shell.js', 'store.js', 'ui.js', 'codec.js', 'transport.js', 'sync.js'].forEach(function (f) {
    document.write('<script src="' + f + q + '"><\/script>');
  });
})();
</script>
<script>
// Fail fast on file skew (e.g. new page + old ui.js): missing shared
// symbols halt here with an actionable banner instead of a silent hang.
(function checkAppFiles() {
  var need = ['Store', 'IDO.transport.connectAndSync', 'IDO.shell.refreshStoreStatus', 'emptyStateHTML',
    'fmtHM', 'sportName', 'num', 'esc', 'fmtDur', 'kmOrDash',
    'hrStats', 'downloadStoreBackup', 'importStoreFile'];
  IDO.shell.checkFiles(need);
})();
// Progress override: sync.js calls setProgress during macros; here it drives
// the spinner + thin step bar (paging rounds update the label; the bar moves
// per phase, so it can pause inside long loops — the spinner shows life).
function setProgress(done, total, label) {
  var el = document.getElementById('syncLabel');
  if (el) el.textContent = 'Syncing: ' + label + ' (' + done + '/' + total + ')';
  var bar = document.getElementById('syncBarInner');
  if (bar && total > 0) bar.style.width = Math.min(100, Math.round((done / total) * 100)) + '%';
}
function syncUiBusy(busy, label) {
  document.getElementById('btnSync').disabled = busy;
  document.getElementById('syncBarWrap').style.display = busy ? 'block' : 'none';
  document.getElementById('syncSpinner').style.display = busy ? 'inline-block' : 'none';
  if (!busy) document.getElementById('syncBarInner').style.width = '0%';
  if (label !== undefined) document.getElementById('syncLabel').textContent = label;
}
function statusLink(msg) {
  document.getElementById('status').innerHTML = esc(msg) +
    ' — <a href="diagnostics.html">open Diagnostics</a>.';
}
document.getElementById('btnSync').addEventListener('click', async function () {
  syncUiBusy(true, 'Connecting…');
  try {
    // autoSetup: a fresh/reset watch runs bind + auth instead of failing.
    await IDO.transport.connectAndSync({ autoSetup: true });
    document.getElementById('syncLabel').textContent = 'Sync done.';
  } catch (e) {
    document.getElementById('syncLabel').textContent = 'Sync failed.';
    statusLink('Sync failed (' + (e && e.message ? e.message : e) + ')');
  }
  syncUiBusy(false);
  render();
});
document.getElementById('btnBackup').addEventListener('click', async function () {
  try {
    await downloadStoreBackup();
    document.getElementById('status').textContent = 'Backup downloaded.';
  } catch (e) {
    statusLink('Backup failed (' + e + ')');
  }
});
document.getElementById('fileImport').addEventListener('change', async function (e) {
  var f = e.target.files && e.target.files[0];
  if (!f) return;
  try {
    var c = await importStoreFile(f);
    await render();
    document.getElementById('status').textContent = 'Imported steps ' + c.steps +
      ', sleep ' + c.sleep + ', HR ' + c.hr + ', workouts ' + c.workout +
      ', SpO2 ' + c.spo2 + ', pressure ' + c.pressure + '.';
  } catch (err) {
    statusLink('Import failed (' + (err && err.message ? err.message : err) + ')');
  }
  e.target.value = '';
});
async function renderLastSync() {
  var el = document.getElementById('lastSync');
  try {
    var r = await Store.get('last-sync', 'meta');
    if (r && r.payload && typeof r.payload.day === 'string') {
      var at = r.payload.at ? new Date(r.payload.at) : null;
      var when = at && !isNaN(at.getTime()) ? ' · ' + at.toLocaleString() : '';
      el.textContent = 'Last sync: ' + r.payload.day + when;
    } else {
      el.textContent = 'Last sync: never — tap Sync Data.';
    }
  } catch (e) {
    el.textContent = 'Last sync: unavailable (' + e + ')';
  }
}
// Latest value from a SpO2/stress record (older rows use t, newer tMin).
function lastSampleValue(p) {
  var samples = (p && p.samples) || [];
  for (var i = samples.length - 1; i >= 0; i--) {
    var v = samples[i] && samples[i].value;
    if (v !== undefined && v !== null) return v;
  }
  return null;
}
// Chart/format helpers live in ui.js (shared with detail pages).
async function render() {
  document.getElementById('status').textContent = 'Loading…';
  try {
    var steps = await Store.list('steps');
    var sleep = await Store.list('sleep');
    var workouts = await Store.list('workout');
    var hrByDate = {};
    try {
      var hrs = await Store.list('hr');
      hrs.forEach(function (r) { hrByDate[r.date] = r.payload; });
    } catch (e) {}

    // Activity: latest steps + kcal + BPM, linked to the 7-day page.
    if (steps.length) {
      var last = steps[steps.length - 1].payload;
      var hs = hrStats(hrByDate[last.date]);
      var bpmBit = hs ? ' · ' + hs.avg + ' bpm avg' +
        (hs.silent !== null && hs.silent !== '' ? ' (rest ' + hs.silent + ')' : '') : '';
      document.querySelector('#secSteps .body').innerHTML =
        '<div class="big">' + esc(num(last.steps)) + ' <span class="muted">steps · ' +
        esc(num(last.kcal, ' kcal')) + esc(bpmBit) + '</span></div>' +
        '<div class="muted">' + esc(last.date) + ' · ' + esc(kmOrDash(last.distance_m)) + '</div>';
    } else {
      document.querySelector('#secSteps .body').innerHTML = emptyStateHTML('No activity yet', 'Sync your watch to see steps and daily totals.');
    }

    // Sleep: last night only, linked to the week page.
    if (sleep.length) {
      var n0 = sleep[sleep.length - 1].payload;
      document.querySelector('#secSleep .body').innerHTML =
        '<div class="big">' + esc(fmtHM(n0.total_min)) + ' <span class="muted">' +
        esc(n0.night) + '</span></div>';
    } else {
      document.querySelector('#secSleep .body').innerHTML = emptyStateHTML('No sleep data yet', 'Sync your watch to see recent nights.');
    }

    // Health: latest SpO2 + stress reading, linked to the detail page.
    var spo2 = [], press = [];
    try { spo2 = await Store.list('spo2'); } catch (e) {}
    try { press = await Store.list('pressure'); } catch (e) {}
    if (spo2.length || press.length) {
      var spRec = spo2.length ? spo2[spo2.length - 1].payload : null;
      var prRec = press.length ? press[press.length - 1].payload : null;
      var bits = [];
      var spVal = lastSampleValue(spRec);
      if (spVal !== null) bits.push(spVal + '% SpO2');
      var prVal = lastSampleValue(prRec);
      if (prVal !== null) bits.push('stress ' + prVal);
      var healthDate = (spRec && spRec.date) || (prRec && prRec.date) || '';
      document.querySelector('#secHealth .body').innerHTML =
        '<div class="big">' + esc(bits.length ? bits.join(' · ') : '—') + '</div>' +
        '<div class="muted">' + esc(healthDate) + '</div>';
    } else {
      document.querySelector('#secHealth .body').innerHTML = emptyStateHTML('No health readings yet', 'Sync your watch to see SpO₂ and stress.');
    }

    // Workouts: most recent only, linked to the full list.
    if (workouts.length) {
      var w = workouts[workouts.length - 1].payload;
      var workoutHr = [w.avgHr, w.maxHr, w.minHr].some(function (v) { return Number(v) > 0; }) ?
        ' · HR ' + esc(num(w.avgHr)) + '/' + esc(num(w.maxHr)) + '/' + esc(num(w.minHr)) : '';
      var swimNote = w.kind === 'swim' ? ' · ' + (Number(w.laps) === 0 ? 'No laps recorded' : esc(num(w.laps, ' laps'))) : '';
      document.querySelector('#secWorkouts .body').innerHTML =
        '<div class="big">' + esc(sportName(w)) + ' <span class="muted">' + esc(w.date || '') + ' · ' +
        esc(num(w.kcal)) + ' kcal</span></div>' +
        '<div class="muted">' + esc(fmtDur(w.durationsS || 0)) +
        (w.distanceM ? ' · ' + esc(kmOrDash(w.distanceM)) : '') +
        workoutHr + swimNote + '</div>';
    } else {
      document.querySelector('#secWorkouts .body').innerHTML = emptyStateHTML('No workouts yet', 'Record a workout or swim, then sync the watch.');
    }

    document.getElementById('status').textContent = '';
    document.getElementById('debugDump').textContent = JSON.stringify({
      steps: steps, sleep: sleep, workouts: workouts, spo2: spo2, pressure: press,
    }, null, 1).slice(0, 20000);
    renderLastSync();
    IDO.shell.refreshStoreStatus();
  } catch (e) {
    statusLink('Store unavailable (' + e + ')');
  }
}
document.getElementById('btnRefresh').addEventListener('click', render);
render();
</script>
<nav class="tabs"></nav>
</body>
</html>
