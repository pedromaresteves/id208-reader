<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID208 Workouts</title>
<link rel="stylesheet" href="app.css">
<style>
#workoutDetail { margin-top: 8px; }
</style>
</head>
<body>
<h1>Workouts</h1>
<p><a href="index.html">← Dashboard</a> <span id="status" class="muted"></span></p>
<section><h2 id="listHead">All workouts — tap one for details</h2><div class="body muted">Loading…</div><canvas id="chWorkoutDetail"></canvas><div id="workoutDetail" class="muted">Tap a row above.</div></section>
<section id="secMonth"><h2>Month</h2>
<p><button id="btnPrevM" title="Previous month" aria-label="Previous month">‹</button>
<span id="monthLabel" class="muted"></span>
<button id="btnNextM" title="Next month" aria-label="Next month">›</button></p>
<canvas id="chMonth"></canvas><div id="weekList" class="body muted"></div></section>
<script src="store.js"></script>
<script src="ui.js"></script>
<script>
// Fail fast on file skew (see index.html): banner instead of silent hang.
(function checkAppFiles() {
  var need = ['Store', 'lineChart', 'barChart', 'esc', 'num', 'fmtDur', 'sportName', 'pad2',
    'monthKey', 'addMonths', 'daysInMonth', 'weeksOf', 'mondayOf', 'addDays'];
  var missing = need.filter(function (k) { return typeof window[k] === 'undefined'; });
  if (!missing.length) return;
  var d = document.createElement('div');
  d.style.cssText = 'background:#7f1d1d;color:#fff;padding:12px;margin:8px;border-radius:8px;font-weight:bold;';
  d.textContent = 'App files out of sync (' + missing.join(', ') +
    ' missing) — re-download all webapp files together (index/pull/store/ble/ui).';
  document.body.insertBefore(d, document.body.firstChild);
  throw new Error('halt: ' + missing.join(','));
})();
var WORKOUTS = [], ALL = [], SEL = null, CUR = null;
function inWeek(r) {
  var d = r.payload.date || '';
  return d >= SEL.start && d <= SEL.end;
}
function showWorkout(i) {
  var w = WORKOUTS[i].payload;
  var bpms = (w.samples || []).map(function (s) {
    return s && typeof s === 'object' ? s.bpm : s;
  }).filter(function (b) { return typeof b === 'number'; });
  // startS is seconds-since-midnight (watch-local): format arithmetically.
  // new Date(startS * 1000) would shift it by the phone timezone — wrong.
  var st = w.startS || 0;
  var startHM = pad2(Math.floor(st / 3600)) + ':' + pad2(Math.floor((st % 3600) / 60));
  var formRows = '';
  if (w.avgCadenceSpm) {
    formRows += '<div><div class="k">Cadence</div><div class="v">' +
      esc(w.avgCadenceSpm) + '/' + esc(w.maxCadenceSpm) + ' spm</div></div>';
  }
  if (w.avgStrideCm) {
    formRows += '<div><div class="k">Stride</div><div class="v">' +
      esc(w.avgStrideCm) + '/' + esc(w.maxStrideCm) + ' cm</div></div>';
  }
  if (w.avgPaceS) {
    formRows += '<div><div class="k">Pace</div><div class="v">' +
      Math.floor(w.avgPaceS / 60) + "'" + (w.avgPaceS % 60) + '"/km</div></div>';
  }
  document.getElementById('workoutDetail').innerHTML =
    '<div class="big">' + esc(sportName(w)) + '</div>' +
    '<div class="muted">' + esc(w.date || '') + ' · start ' + startHM + '</div>' +
    '<div class="stats">' +
    '<div><div class="k">Duration</div><div class="v">' + esc(fmtDur(w.durationsS || 0)) + '</div></div>' +
    '<div><div class="k">Calories</div><div class="v">' + esc(num(w.kcal)) + '</div></div>' +
    '<div><div class="k">Distance</div><div class="v">' +
    esc(kmOrDash(w.distanceM)) + '</div></div>' +
    '<div><div class="k">Avg HR</div><div class="v">' + esc(num(w.avgHr)) + ' bpm</div></div>' +
    '<div><div class="k">Max HR</div><div class="v">' + esc(num(w.maxHr)) + ' bpm</div></div>' +
    '<div><div class="k">Min HR</div><div class="v">' + esc(num(w.minHr)) + ' bpm</div></div>' +
    (formRows ? '<h3>Form</h3>' + formRows : '') +
    '</div>' +
    '<div class="muted">' + bpms.length + ' HR samples</div>';
  lineChart('chWorkoutDetail', bpms);
}
function renderList() {
  document.getElementById('listHead').textContent =
    'Week ' + SEL.start.slice(5) + ' – ' + SEL.end.slice(5) + ' — tap one for details';
  if (!WORKOUTS.length) {
    document.querySelector('section .body').textContent = 'No workouts in week ' + SEL.start + ' – ' + SEL.end + '.';
    document.getElementById('workoutDetail').textContent = '';
    lineChart('chWorkoutDetail', []);
    return;
  }
  var rows = WORKOUTS.map(function (r, i) {
    var w = r.payload;
    return '<tr class="pick" data-i="' + i + '"><td>' + esc(w.date || '') + '</td><td>' +
      esc(sportName(w)) + '</td><td>' + esc(num(w.kcal)) + '</td><td>›</td></tr>';
  }).join('');
  document.querySelector('section .body').innerHTML =
    '<table><tr><th>Date</th><th>Workout</th><th>Kcal</th><th></th></tr>' + rows + '</table>';
  document.querySelectorAll('section tr.pick').forEach(function (tr) {
    tr.addEventListener('click', function () { showWorkout(Number(tr.dataset.i)); });
  });
  showWorkout(0); // latest by default
}
function selectWeek() {
  WORKOUTS = ALL.filter(inWeek).slice().reverse(); // latest first
  renderList();
}
function renderMonth() {
  document.getElementById('monthLabel').textContent = CUR;
  var kcalByDay = {};
  ALL.forEach(function (r) {
    var d = r.payload.date;
    if (d && d.slice(0, 7) === CUR) kcalByDay[d] = (kcalByDay[d] || 0) + (Number(r.payload.kcal) || 0);
  });
  var n = daysInMonth(CUR), values = [];
  for (var d = 1; d <= n; d++) {
    values.push(kcalByDay[CUR + '-' + String(d).padStart(2, '0')] || 0);
  }
  barChart('chMonth', ['1', String(n)], values);
  var rows = weeksOf(CUR).map(function (w) {
    var count = 0, kcal = 0;
    ALL.forEach(function (r) {
      var d = r.payload.date || '';
      if (d >= w.start && d <= w.end) { count++; kcal += Number(r.payload.kcal) || 0; }
    });
    var sel = SEL && w.start === SEL.start ? ' ›' : '';
    return '<tr class="weekrow" data-start="' + w.start + '" data-end="' + w.end + '"><td>' +
      esc(w.start.slice(5)) + ' – ' + esc(w.end.slice(5)) + sel + '</td><td>' +
      count + ' workouts · ' + esc(num(kcal)) + ' kcal</td><td>›</td></tr>';
  }).join('');
  document.getElementById('weekList').innerHTML =
    '<table><tr><th>Week (tap to view)</th><th>Total</th><th></th></tr>' + rows + '</table>';
  document.querySelectorAll('#weekList tr.weekrow').forEach(function (tr) {
    tr.addEventListener('click', function () {
      SEL = { start: tr.dataset.start, end: tr.dataset.end };
      selectWeek();
      renderMonth();
    });
  });
}
async function render() {
  try {
    ALL = await Store.list('workout'); // oldest first
    if (!ALL.length) {
      document.querySelector('section .body').textContent = 'No workouts yet — record one, then pull.';
      document.getElementById('status').textContent = '';
      return;
    }
    var latest = ALL[ALL.length - 1].payload.date || '';
    CUR = monthKey(latest || new Date().toISOString().slice(0, 10));
    SEL = { start: mondayOf(latest), end: addDays(mondayOf(latest), 6) };
    selectWeek();
    renderMonth();
    document.getElementById('status').textContent = ALL.length + ' workouts in store.';
  } catch (e) {
    document.getElementById('status').textContent = 'Store unavailable: ' + e;
  }
}
document.getElementById('btnPrevM').addEventListener('click', function () {
  CUR = addMonths(CUR, -1); renderMonth();
});
document.getElementById('btnNextM').addEventListener('click', function () {
  CUR = addMonths(CUR, 1); renderMonth();
});
render();
</script>
<nav class="tabs">
<a href="index.html">Dashboard</a>
<a href="activity.html">Activity</a>
<a href="sleep.html">Sleep</a>
<a href="workout.html" aria-current="page">Workouts</a>
<a href="watch.html">Watch</a>
<a href="pull.html">Pull</a>
</nav>
</body>
</html>
