<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID208 Workouts</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<h1>Workouts</h1>
<p id="status" class="muted" aria-live="polite"></p>
<section id="secList"><div class="section-head"><h2 id="listHead">Workouts</h2><label class="chip"><input type="checkbox" id="chkHidden"> Show empty</label></div><div class="body list muted">Loading…</div><div id="workoutDetail" class="card" aria-live="polite">Select a workout to see details.</div><canvas id="chWorkoutDetail" aria-label="Workout heart-rate chart"></canvas><div id="workoutChartNote" class="muted"></div></section>
<section id="secMonth"><h2>Month</h2>
<p class="pager"><button id="btnPrevM" title="Previous month" aria-label="Previous month">‹</button>
<span id="monthLabel" class="month-label"></span>
<button id="btnNextM" title="Next month" aria-label="Next month">›</button></p>
<canvas id="chMonth" aria-label="Daily workout calories by month"></canvas><div id="weekList" class="body muted table-wrap"></div></section>
<script>
// Cache-bust every local script when the page has ?v=<epoch> (see index.html).
(function () {
  var m = location.search.match(/[?&]v=([^&]+)/);
  var q = m ? '?v=' + m[1] : '';
  ['shell.js', 'store.js', 'ui.js'].forEach(function (f) {
    document.write('<script src="' + f + q + '"><\/script>');
  });
})();
</script>
<script>
// Fail fast on file skew (see index.html): banner + fresh reload instead of silent hang.
(function checkAppFiles() {
  var need = ['Store', 'lineChart', 'setupCanvas', 'barChart', 'emptyStateHTML', 'esc', 'num', 'fmtDur', 'sportName', 'kmOrDash', 'pad2',
    'monthKey', 'addMonths', 'daysInMonth', 'weeksOf', 'mondayOf', 'addDays', 'wireMonthNav',
    'isoWeek', 'todayStr'];
  IDO.shell.checkFiles(need);
})();
var WORKOUTS = [], ALL = [], SEL = null, CUR = null, SHOW_HIDDEN = false, CURRENT_INDEX = 0;
function isEmptyWorkout(w) {
  if (!w || typeof w !== 'object') return true;
  if (!w.date || /^no-date-/.test(w.date)) return true; // dateless imports
  var hasDur = Number(w.durationsS) > 0;
  var hasKcal = Number(w.kcal) > 0;
  var hasSamples = Array.isArray(w.samples) && w.samples.length > 0;
  var hasSwimSummary = w.laps !== undefined || w.strokes !== undefined || w.swolf !== undefined;
  var hasHr = [w.avgHr, w.maxHr, w.minHr].some(function (v) {
    return v !== undefined && v !== null && v !== '' && Number(v) > 0;
  });
  return !(hasDur || hasKcal || hasSamples || hasHr || hasSwimSummary || Number(w.distanceM || w.distance_m) > 0);
}
function visibleAll() {
  return SHOW_HIDDEN ? ALL.slice() : ALL.filter(function (r) { return !isEmptyWorkout(r.payload); });
}
function inWeek(r) {
  var d = r.payload.date || '';
  return d >= SEL.start && d <= SEL.end;
}
function showWorkout(i) {
  CURRENT_INDEX = i;
  var w = WORKOUTS[i].payload;
  var bpms = (w.samples || []).map(function (s) {
    return s && typeof s === 'object' ? s.bpm : s;
  }).filter(function (b) { return typeof b === 'number'; });
  // startS is seconds-since-midnight (watch-local): format arithmetically.
  // new Date(startS * 1000) would shift it by the phone timezone — wrong.
  var st = w.startS || 0;
  var startHM = pad2(Math.floor(st / 3600)) + ':' + pad2(Math.floor((st % 3600) / 60));
  var formRows = '';
  if (w.avgCadenceSpm) {
    formRows += '<div><div class="k">Cadence</div><div class="v">' +
      esc(w.avgCadenceSpm) + '/' + esc(w.maxCadenceSpm) + ' spm</div></div>';
  }
  if (w.avgStrideCm) {
    formRows += '<div><div class="k">Stride</div><div class="v">' +
      esc(w.avgStrideCm) + '/' + esc(w.maxStrideCm) + ' cm</div></div>';
  }
  if (w.avgPaceS) {
    formRows += '<div><div class="k">Pace</div><div class="v">' +
      Math.floor(w.avgPaceS / 60) + "'" + (w.avgPaceS % 60) + '"/km</div></div>';
  }
  var isSwim = w.kind === 'swim';
  var swimSummary = isSwim ? '<div class="section-head"><h3>Swim summary</h3><span class="chip accent">Pool swim</span></div>' : '';
  var swimRows = isSwim ? '<div class="stats">' +
    '<div><div class="k">Laps</div><div class="v">' + (Number(w.laps) === 0 ? '0 · no laps recorded' : esc(num(w.laps))) + '</div></div>' +
    '<div><div class="k">Pool length</div><div class="v">' + esc(num(w.poolLengthM, ' m')) + '</div></div>' +
    '<div><div class="k">Strokes</div><div class="v">' + esc(num(w.strokes)) + '</div></div>' +
    '<div><div class="k">SWOLF</div><div class="v">' + esc(num(w.swolf)) + '</div></div></div>' : '';
  document.getElementById('workoutDetail').innerHTML =
    '<div class="section-head"><div><div class="big">' + esc(sportName(w)) + '</div><div class="muted">' + esc(w.date || '') + ' · ' + startHM + '</div></div>' +
    '<span class="chip">' + bpms.length + ' HR samples</span></div>' +
    '<div class="stat-grid cols-4">' +
    '<div class="stat-tile"><span class="stat-label">Duration</span><span class="stat-value">' + esc(fmtDur(w.durationsS || 0)) + '</span></div>' +
    '<div class="stat-tile"><span class="stat-label">Distance</span><span class="stat-value">' + esc(kmOrDash(w.distanceM)) + '</span></div>' +
    '<div class="stat-tile"><span class="stat-label">Calories</span><span class="stat-value metric-kcal">' + esc(num(w.kcal, ' kcal')) + '</span></div>' +
    '<div class="stat-tile"><span class="stat-label">Avg HR</span><span class="stat-value metric-hr">' + esc(num(w.avgHr, ' bpm')) + '</span></div>' +
    '</div>' + swimSummary + swimRows +
    (formRows ? '<h3>Workout metrics</h3><div class="stats">' + formRows + '</div>' : '');
  var chart = document.getElementById('chWorkoutDetail');
  if (bpms.length > 1) {
    chart.style.display = 'block';
    document.getElementById('workoutChartNote').textContent = 'Heart rate · elapsed time';
    lineChart('chWorkoutDetail', bpms, undefined, undefined, { elapsed: true, duration: w.durationsS || 0, fill: true });
  } else {
    chart.style.display = 'none';
    document.getElementById('workoutChartNote').innerHTML = emptyStateHTML('No heart-rate samples', 'This session has no heart-rate trace.');
  }
  document.querySelectorAll('.workout-card').forEach(function (card) {
    var selected = Number(card.getAttribute('data-i')) === i;
    card.classList.toggle('selected', selected);
    card.setAttribute('aria-pressed', String(selected));
  });
}
function renderList() {
  document.getElementById('listHead').textContent =
    'Week ' + SEL.start.slice(5) + ' – ' + SEL.end.slice(5);
  if (!WORKOUTS.length) {
    document.querySelector('#secList .body').innerHTML = emptyStateHTML('No workouts this week', 'Record a workout or swim, then sync the watch.');
    document.getElementById('workoutDetail').innerHTML = '';
    document.getElementById('chWorkoutDetail').style.display = 'none';
    document.getElementById('workoutChartNote').textContent = '';
    return;
  }
  var rows = WORKOUTS.map(function (r, i) {
    var w = r.payload;
    var start = Number(w.startS) || 0;
    var at = pad2(Math.floor(start / 3600)) + ':' + pad2(Math.floor((start % 3600) / 60));
    var selected = i === CURRENT_INDEX ? ' selected' : '';
    return '<button type="button" class="workout-card' + selected + '" data-i="' + i + '" aria-pressed="' + (i === CURRENT_INDEX) + '">' +
      '<span class="row-top"><span class="row-title">' + esc(sportName(w)) + '</span><span class="chip">' + esc(w.date || 'Undated') + ' · ' + at + '</span></span>' +
      '<span class="stat-grid cols-4"><span class="stat-tile"><span class="stat-label">Duration</span><span class="stat-value">' + esc(fmtDur(w.durationsS || 0)) + '</span></span>' +
      '<span class="stat-tile"><span class="stat-label">Distance</span><span class="stat-value">' + esc(kmOrDash(w.distanceM)) + '</span></span>' +
      '<span class="stat-tile"><span class="stat-label">Calories</span><span class="stat-value">' + esc(num(w.kcal, ' kcal')) + '</span></span>' +
      '<span class="stat-tile"><span class="stat-label">Avg HR</span><span class="stat-value">' + esc(num(w.avgHr, ' bpm')) + '</span></span></span></button>';
  }).join('');
  document.querySelector('#secList .body').innerHTML =
    rows;
  document.querySelectorAll('#secList .workout-card').forEach(function (card) {
    card.addEventListener('click', function () { showWorkout(Number(card.dataset.i)); });
  });
  if (CURRENT_INDEX >= WORKOUTS.length) CURRENT_INDEX = 0;
  showWorkout(CURRENT_INDEX); // latest by default
}
function selectWeek() {
  WORKOUTS = visibleAll().filter(inWeek).slice().reverse(); // latest first
  renderList();
}
function renderMonth() {
  document.getElementById('monthLabel').textContent = CUR;
  var vis = visibleAll();
  var kcalByDay = {};
  vis.forEach(function (r) {
    var d = r.payload.date;
    if (d && d.slice(0, 7) === CUR) kcalByDay[d] = (kcalByDay[d] || 0) + (Number(r.payload.kcal) || 0);
  });
  var n = daysInMonth(CUR), values = [];
  for (var d = 1; d <= n; d++) {
    values.push(kcalByDay[CUR + '-' + String(d).padStart(2, '0')] || 0);
  }
  barChart('chMonth', values.map(function (_, i) { return String(i + 1); }), values, { labelEvery: 5 });
  var rows = weeksOf(CUR).map(function (w) {
    var count = 0, kcal = 0;
    vis.forEach(function (r) {
      var d = r.payload.date || '';
      if (d >= w.start && d <= w.end) { count++; kcal += Number(r.payload.kcal) || 0; }
    });
    var sel = SEL && w.start === SEL.start ? ' ›' : '';
    return '<tr class="weekrow" data-start="' + w.start + '" data-end="' + w.end + '"><td>' +
      'W' + isoWeek(w.start) + ' · ' + esc(w.start.slice(5)) + ' – ' + esc(w.end.slice(5)) + sel + '</td><td>' +
      count + ' workouts · ' + esc(num(kcal)) + ' kcal</td><td>›</td></tr>';
  }).join('');
  document.getElementById('weekList').innerHTML =
    '<table><tr><th>Week (tap to view)</th><th>Total</th><th></th></tr>' + rows + '</table>';
  document.querySelectorAll('#weekList tr.weekrow').forEach(function (tr) {
    tr.addEventListener('click', function () {
      SEL = { start: tr.dataset.start, end: tr.dataset.end };
      selectWeek();
      renderMonth();
    });
  });
}
async function render() {
  try {
    ALL = await Store.list('workout'); // oldest first
    if (!ALL.length) {
      CUR = monthKey(todayStr());
      SEL = { start: mondayOf(todayStr()), end: addDays(mondayOf(todayStr()), 6) };
      CURRENT_INDEX = 0;
      selectWeek();
      renderMonth();
      document.getElementById('status').textContent = 'No workouts yet — record one, then sync the watch.';
      return;
    }
    // Newest dated record anchors the week (dateless imports sort last but
    // belong to no week); with no dates at all, pin to month start, never NaN.
    var latest = '';
    ALL.forEach(function (r) { if (r.payload.date) latest = r.payload.date; });
    CUR = monthKey(latest || todayStr());
    var anchor = latest || (CUR + '-01');
    SEL = { start: mondayOf(anchor), end: addDays(mondayOf(anchor), 6) };
    selectWeek();
    renderMonth();
    var hidden = ALL.length - visibleAll().length;
    document.getElementById('status').textContent = visibleAll().length + ' shown' +
      (hidden ? ', ' + hidden + ' hidden empties' : '') + ' (' + ALL.length + ' in store).';
  } catch (e) {
    document.getElementById('status').textContent = 'Store unavailable: ' + e;
  }
}
document.getElementById('chkHidden').addEventListener('change', function (e) {
  SHOW_HIDDEN = !!e.target.checked;
  selectWeek();
  renderMonth();
  var hidden = ALL.length - visibleAll().length;
  document.getElementById('status').textContent = visibleAll().length + ' shown' +
    (hidden ? ', ' + hidden + ' hidden empties' : '') + ' (' + ALL.length + ' in store).';
});
wireMonthNav(function (n) { CUR = addMonths(CUR, n); renderMonth(); });
render();
</script>
<nav class="tabs"></nav>
</body>
</html>
