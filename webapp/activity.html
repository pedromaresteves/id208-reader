<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID208 Activity</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<h1>Activity</h1>
<p><a href="index.html">← Dashboard</a> <span id="status" class="muted"></span></p>
<section id="secActivity"><h2>Steps & kcal</h2><div class="body muted">Loading…</div><canvas id="chActivity"></canvas><div id="weekAvg" class="muted"></div></section>
<section id="secMonth"><h2>Month</h2>
<p><button id="btnPrevM" title="Previous month" aria-label="Previous month">‹</button>
<span id="monthLabel" class="month-label"></span>
<button id="btnNextM" title="Next month" aria-label="Next month">›</button></p>
<canvas id="chMonth"></canvas><div id="weekList" class="body muted"></div></section>
<script src="store.js"></script>
<script src="ui.js"></script>
<script>
// Fail fast on file skew (see index.html): banner instead of silent hang.
(function checkAppFiles() {
  var need = ['Store', 'barChart', 'esc', 'num', 'kmOrDash', 'monthKey',
    'addMonths', 'daysInMonth', 'weeksOf', 'mondayOf', 'addDays', 'DEFAULT_GOALS',
    'wireMonthNav', 'isoWeek'];
  var missing = need.filter(function (k) { return typeof window[k] === 'undefined'; });
  if (!missing.length) return;
  var d = document.createElement('div');
  d.style.cssText = 'background:#7f1d1d;color:#fff;padding:12px;margin:8px;border-radius:8px;font-weight:bold;';
  d.textContent = 'App files out of sync (' + missing.join(', ') +
    ' missing) — re-download all webapp files together (index/pull/store/ble/ui).';
  document.body.insertBefore(d, document.body.firstChild);
  throw new Error('halt: ' + missing.join(','));
})();
var STEPS = [], GOALS = DEFAULT_GOALS, SEL = null, CUR = null;
function met(v, g) {
  return v !== undefined && v !== null && v !== '' && Number(v) >= g;
}
function goalCell(v, g) {
  return esc(num(v)) + ' / ' + esc(num(g)) + (met(v, g) ? ' <span class="met">✓</span>' : '');
}
function renderWeek() {
  var map = {};
  STEPS.forEach(function (r) { map[r.date] = r.payload; });
  var days = [];
  for (var i = 0; i < 7; i++) days.push(addDays(SEL.start, i));
  var rows = days.map(function (ds) {
    var s = map[ds];
    if (!s) {
      return '<tr><td>' + esc(ds) + '</td><td>—</td><td>—</td><td>—</td></tr>';
    }
    return '<tr><td>' + esc(ds) + '</td><td>' + goalCell(s.steps, GOALS.steps) + '</td>' +
      '<td>' + goalCell(s.kcal, GOALS.kcal) + '</td><td>' + esc(kmOrDash(s.distance_m)) + '</td></tr>';
  }).join('');
  document.querySelector('#secActivity .body').innerHTML =
    '<table><tr><th>Date</th><th>Steps / goal</th><th>Kcal / goal</th><th>Dist</th></tr>' + rows + '</table>';
  barChart('chActivity', days.map(function (d) { return d.slice(5); }),
    days.map(function (d) { return (map[d] && Number(map[d].steps)) || 0; }));
  var withData = days.filter(function (d) { return map[d]; });
  if (withData.length) {
    var tSteps = 0, tKcal = 0, nKcal = 0;
    withData.forEach(function (d) {
      tSteps += Number(map[d].steps) || 0;
      if (map[d].kcal !== undefined && map[d].kcal !== null && map[d].kcal !== '') {
        tKcal += Number(map[d].kcal) || 0; nKcal++;
      }
    });
    document.getElementById('weekAvg').innerHTML =
      'Week ' + esc(SEL.start.slice(5)) + ' – ' + esc(SEL.end.slice(5)) +
      ' · avg of ' + withData.length + ' days: ' + Math.round(tSteps / withData.length) +
      ' steps' + (nKcal ? ' · ' + Math.round(tKcal / nKcal) + ' kcal' : '') +
      ' · goals ' + esc(num(GOALS.steps)) + ' steps / ' + esc(num(GOALS.kcal)) +
      ' kcal (<a href="watch.html">edit in Settings</a>).';
  } else {
    document.getElementById('weekAvg').textContent = 'No data in week ' + SEL.start + ' – ' + SEL.end + '.';
  }
}
function renderMonth() {
  document.getElementById('monthLabel').textContent = CUR;
  var map = {};
  STEPS.forEach(function (r) { map[r.date] = r.payload; });
  var n = daysInMonth(CUR), labels = [], values = [];
  for (var d = 1; d <= n; d++) {
    var ds = CUR + '-' + String(d).padStart(2, '0');
    labels.push(String(d));
    values.push((map[ds] && Number(map[ds].steps)) || 0);
  }
  barChart('chMonth', [labels[0], labels[labels.length - 1]], values);
  var rows = weeksOf(CUR).map(function (w) {
    var total = 0;
    for (var i = 0; i < 7; i++) {
      var s = map[addDays(w.start, i)];
      if (s) total += Number(s.steps) || 0;
    }
    var sel = SEL && w.start === SEL.start ? ' ›' : '';
    return '<tr class="weekrow" data-start="' + w.start + '" data-end="' + w.end + '"><td>' +
      'W' + isoWeek(w.start) + ' · ' + esc(w.start.slice(5)) + ' – ' + esc(w.end.slice(5)) + sel + '</td><td>' +
      esc(num(total)) + ' steps</td><td>›</td></tr>';
  }).join('');
  document.getElementById('weekList').innerHTML =
    '<table><tr><th>Week (tap to view)</th><th>Total</th><th></th></tr>' + rows + '</table>';
  document.querySelectorAll('#weekList tr.weekrow').forEach(function (tr) {
    tr.addEventListener('click', function () {
      SEL = { start: tr.dataset.start, end: tr.dataset.end };
      renderWeek();
      renderMonth();
    });
  });
}
async function render() {
  try {
    STEPS = await Store.list('steps');
    try {
      var grec = await Store.get('goals', 'settings');
      if (grec && grec.payload) GOALS = grec.payload;
    } catch (e) {}
    if (!STEPS.length) {
      document.querySelector('#secActivity .body').textContent = 'No data yet — run a sync.';
      document.getElementById('status').textContent = '';
      return;
    }
    var latest = STEPS[STEPS.length - 1].date;
    CUR = monthKey(latest);
    SEL = { start: mondayOf(latest), end: addDays(mondayOf(latest), 6) };
    renderWeek();
    renderMonth();
    document.getElementById('status').textContent = STEPS.length + ' step days in store.';
  } catch (e) {
    document.getElementById('status').textContent = 'Store unavailable: ' + e;
  }
}
wireMonthNav(function (n) { CUR = addMonths(CUR, n); renderMonth(); });
render();
</script>
<nav class="tabs">
<a href="index.html">Dashboard</a>
<a href="activity.html" aria-current="page">Activity</a>
<a href="sleep.html">Sleep</a>
<a href="workout.html">Workouts</a>
<a href="watch.html">Watch</a>
<a href="pull.html">Pull</a>
</nav>
</body>
</html>
