<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID208 Activity</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<h1>Activity</h1>
<p><a href="index.html">← Dashboard</a> <span id="status" class="muted"></span></p>
<section id="secActivity"><h2>Last 7 days — steps & kcal</h2><div class="body muted">Loading…</div><canvas id="chActivity"></canvas></section>
<script src="store.js"></script>
<script src="ui.js"></script>
<script>
async function render() {
  try {
    var steps = await Store.list('steps');
    var tail = steps.slice(-7).reverse();
    if (!tail.length) {
      document.querySelector('#secActivity .body').textContent = 'No data yet — run a sync.';
      document.getElementById('status').textContent = '';
      return;
    }
    var rows = tail.map(function (r) {
      var s = r.payload;
      return '<tr><td>' + esc(s.date) + '</td><td>' + esc(num(s.steps)) + '</td>' +
        '<td>' + esc(num(s.kcal)) + '</td><td>' +
        esc(s.distance_m ? (s.distance_m / 1000) + 'km' : '—') + '</td></tr>';
    }).join('');
    document.querySelector('#secActivity .body').innerHTML =
      '<table><tr><th>Date</th><th>Steps</th><th>Kcal</th><th>Dist</th></tr>' + rows + '</table>';
    var ordered = steps.slice(-7);
    barChart('chActivity', ordered.map(function (r) { return r.date; }),
      ordered.map(function (r) { return Number(r.payload.steps) || 0; }));
    document.getElementById('status').textContent = steps.length + ' step days in store.';
  } catch (e) {
    document.getElementById('status').textContent = 'Store unavailable: ' + e;
  }
}
render();
</script>
<nav class="tabs">
<a href="index.html">Dashboard</a>
<a href="activity.html" aria-current="page">Activity</a>
<a href="sleep.html">Sleep</a>
<a href="workout.html">Workouts</a>
<a href="pull.html">Pull</a>
</nav>
</body>
</html>
