<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID208 Activity</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<h1>Activity</h1>
<p><a href="index.html">← Dashboard</a> <span id="status" class="muted"></span></p>
<section id="secActivity"><h2>Steps & kcal</h2>
<p><button id="btnPrevW" title="Previous 7 days" aria-label="Previous 7 days">‹ Prev 7</button>
<span id="rangeLabel" class="month-label"></span>
<button id="btnNextW" title="Next 7 days" aria-label="Next 7 days">Next 7 ›</button></p>
<div class="body muted">Loading…</div><canvas id="chActivity"></canvas><div id="weekAvg" class="muted"></div></section>
<script src="store.js"></script>
<script src="ui.js"></script>
<script>
// Fail fast on file skew (see index.html): banner instead of silent hang.
(function checkAppFiles() {
  var need = ['Store', 'barChart', 'esc', 'num', 'kmOrDash', 'hrStats', 'hrCell',
    'addDays', 'DEFAULT_GOALS'];
  var missing = need.filter(function (k) { return typeof window[k] === 'undefined'; });
  if (!missing.length) return;
  var d = document.createElement('div');
  d.style.cssText = 'background:#7f1d1d;color:#fff;padding:12px;margin:8px;border-radius:8px;font-weight:bold;';
  d.textContent = 'App files out of sync (' + missing.join(', ') +
    ' missing) — re-download all webapp files together (index/pull/store/ble/ui).';
  document.body.insertBefore(d, document.body.firstChild);
  throw new Error('halt: ' + missing.join(','));
})();
var STEPS = [], HRMAP = {}, GOALS = DEFAULT_GOALS, END = phoneToday();
function phoneToday() {
  var n = new Date();
  return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0') + '-' +
    String(n.getDate()).padStart(2, '0');
}
function met(v, g) {
  return v !== undefined && v !== null && v !== '' && Number(v) >= g;
}
function goalCell(v, g) {
  return esc(num(v)) + ' / ' + esc(num(g)) + (met(v, g) ? ' <span class="met">✓</span>' : '');
}
function renderWeek() {
  var map = {};
  STEPS.forEach(function (r) { map[r.date] = r.payload; });
  // Rolling 7-day window ending at END (today first, then back).
  var daysAsc = [];
  for (var i = 6; i >= 0; i--) daysAsc.push(addDays(END, -i));
  var start = daysAsc[0];
  document.getElementById('rangeLabel').textContent = start.slice(5) + ' – ' + END.slice(5);
  document.getElementById('btnNextW').disabled = END >= phoneToday();
  var rows = daysAsc.slice().reverse().map(function (ds) {
    var s = map[ds];
    var bpm = esc(hrCell(HRMAP[ds]));
    if (!s) {
      return '<tr><td>' + esc(ds) + '</td><td>—</td><td>—</td><td>—</td><td>' + bpm + '</td></tr>';
    }
    return '<tr><td>' + esc(ds) + '</td><td>' + goalCell(s.steps, GOALS.steps) + '</td>' +
      '<td>' + goalCell(s.kcal, GOALS.kcal) + '</td><td>' + esc(kmOrDash(s.distance_m)) + '</td><td>' + bpm + '</td></tr>';
  }).join('');
  document.querySelector('#secActivity .body').innerHTML =
    '<table><tr><th>Date</th><th>Steps / goal</th><th>Kcal / goal</th><th>Dist</th><th>BPM avg (min–max)</th></tr>' + rows + '</table>';
  barChart('chActivity', daysAsc.map(function (d) { return d.slice(5); }),
    daysAsc.map(function (d) { return (map[d] && Number(map[d].steps)) || 0; }));
  var withData = daysAsc.filter(function (d) { return map[d]; });
  if (withData.length) {
    var tSteps = 0, tKcal = 0, nKcal = 0, tBpm = 0, nBpm = 0, tRest = 0, nRest = 0;
    withData.forEach(function (d) {
      tSteps += Number(map[d].steps) || 0;
      if (map[d].kcal !== undefined && map[d].kcal !== null && map[d].kcal !== '') {
        tKcal += Number(map[d].kcal) || 0; nKcal++;
      }
      var hs = hrStats(HRMAP[d]);
      if (hs) {
        tBpm += hs.avg; nBpm++;
        if (hs.silent !== null && hs.silent !== undefined && hs.silent !== '') {
          tRest += Number(hs.silent) || 0; nRest++;
        }
      }
    });
    document.getElementById('weekAvg').innerHTML =
      '<div><b>7 days ' + esc(start.slice(5)) + ' – ' + esc(END.slice(5)) + '</b>' +
      ' (avg of ' + withData.length + ' days with data)</div>' +
      '<div>Steps <b>' + Math.round(tSteps / withData.length) + '</b>' +
      (nKcal ? ' · Kcal <b>' + Math.round(tKcal / nKcal) + '</b>' : '') +
      (nBpm ? ' · BPM <b>' + Math.round(tBpm / nBpm) + '</b> avg (' + nBpm + 'd)' : '') +
      (nRest ? ' · Rest <b>' + Math.round(tRest / nRest) + '</b>' : '') + '</div>' +
      '<div class="muted">Goals ' + esc(num(GOALS.steps)) + ' steps / ' + esc(num(GOALS.kcal)) +
      ' kcal (<a href="watch.html">edit in Settings</a>)</div>';
  } else {
    document.getElementById('weekAvg').textContent = 'No data ' + start + ' – ' + END + '.';
  }
}
async function render() {
  try {
    STEPS = await Store.list('steps');
    try {
      var hrs = await Store.list('hr');
      HRMAP = {};
      hrs.forEach(function (r) { HRMAP[r.date] = r.payload; });
    } catch (e) { HRMAP = {}; }
    try {
      var grec = await Store.get('goals', 'settings');
      if (grec && grec.payload) GOALS = grec.payload;
    } catch (e) {}
    if (!STEPS.length && !Object.keys(HRMAP).length) {
      document.querySelector('#secActivity .body').textContent = 'No data yet — run a sync.';
    }
    END = phoneToday(); // each visit re-anchors on today
    renderWeek();
    document.getElementById('status').textContent = STEPS.length + ' step days, ' +
      Object.keys(HRMAP).length + ' HR days in store.';
  } catch (e) {
    document.getElementById('status').textContent = 'Store unavailable: ' + e;
  }
}
document.getElementById('btnPrevW').addEventListener('click', function () {
  END = addDays(END, -7);
  renderWeek();
});
document.getElementById('btnNextW').addEventListener('click', function () {
  var today = phoneToday();
  END = addDays(END, 7) > today ? today : addDays(END, 7);
  renderWeek();
});
render();
</script>
<nav class="tabs">
<a href="index.html">Dashboard</a>
<a href="activity.html" aria-current="page">Activity</a>
<a href="sleep.html">Sleep</a>
<a href="workout.html">Workouts</a>
<a href="watch.html">Watch</a>
<a href="pull.html">Pull</a>
</nav>
</body>
</html>
