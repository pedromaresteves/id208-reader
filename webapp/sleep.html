<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID208 Sleep week</title>
<link rel="stylesheet" href="app.css">
<style>
canvas { height: 140px; cursor: pointer; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin: 0 2px; }
#nightDetail { margin-top: 8px; }
</style>
</head>
<body>
<h1>Sleep week</h1>
<p><a href="index.html">← Dashboard</a> <span id="status" class="muted"></span></p>
<section><h2>Last 7 nights — tap a bar for details</h2>
<div class="muted"><span class="swatch" style="background:#1d4ed8;"></span>deep
<span class="swatch" style="background:#a78bfa;"></span>REM
<span class="swatch" style="background:#93c5fd;"></span>light
<span class="swatch" style="background:#e5e7eb;"></span>awake</div>
<canvas id="chSleepWeek"></canvas>
<div id="nightDetail" class="muted">Tap a bar above.</div></section>
<script src="store.js"></script>
<script src="ui.js"></script>
<script>
// Fail fast on file skew (see index.html): banner instead of silent hang.
(function checkAppFiles() {
  var need = ['Store', 'stackedBarChart', 'barAt', 'esc', 'num', 'fmtHM'];
  var missing = need.filter(function (k) { return typeof window[k] === 'undefined'; });
  if (!missing.length) return;
  var d = document.createElement('div');
  d.style.cssText = 'background:#7f1d1d;color:#fff;padding:12px;margin:8px;border-radius:8px;font-weight:bold;';
  d.textContent = 'App files out of sync (' + missing.join(', ') +
    ' missing) — re-download all webapp files together (index/pull/store/ble/ui).';
  document.body.insertBefore(d, document.body.firstChild);
  throw new Error('halt: ' + missing.join(','));
})();
var NIGHTS = [];
function partsOf(n) {
  return [
    { v: Number(n.deep_min) || 0, color: '#1d4ed8', name: 'deep' },
    { v: Number(n.rem_min) || 0, color: '#a78bfa', name: 'REM' },
    { v: Number(n.light_min) || 0, color: '#93c5fd', name: 'light' },
    { v: Number(n.wake_min) || 0, color: '#e5e7eb', name: 'awake' },
  ];
}
function showNight(i) {
  var n = NIGHTS[i].payload;
  document.getElementById('nightDetail').innerHTML =
    '<div class="big">' + esc(fmtHM(n.total_min)) + '</div>' +
    '<div class="muted">' + esc(n.night) + ' · ' + esc(n.fall_asleep) + ' → ' + esc(n.get_up) + '</div>' +
    '<div class="stats">' +
    '<div><div class="k">Awake</div><div class="v">' + esc(fmtHM(n.wake_min)) + '</div></div>' +
    '<div><div class="k">Light</div><div class="v">' + esc(fmtHM(n.light_min)) + '</div></div>' +
    '<div><div class="k">REM</div><div class="v">' + esc(fmtHM(n.rem_min)) + '</div></div>' +
    '<div><div class="k">Deep</div><div class="v">' + esc(fmtHM(n.deep_min)) + '</div></div>' +
    '</div>';
}
function drawWeek(selected) {
  stackedBarChart('chSleepWeek', NIGHTS.map(function (r) {
    var n = r.payload;
    return {
      label: String(n.night).slice(5),
      total: Number(n.total_min) || 0,
      parts: partsOf(n),
    };
  }), selected);
}
async function render() {
  try {
    var sleep = await Store.list('sleep');
    // Skip zero-total records (stale partials) — they render as dateless gaps.
    NIGHTS = sleep.filter(function (r) {
      return Number(r.payload.total_min) > 0;
    }).slice(-7);
    if (!NIGHTS.length) {
      document.getElementById('nightDetail').textContent = 'No data yet — run a sync.';
      document.getElementById('status').textContent = '';
      return;
    }
    drawWeek(NIGHTS.length - 1); // latest highlighted by default
    showNight(NIGHTS.length - 1);
    document.getElementById('status').textContent = sleep.length + ' nights in store.';
  } catch (e) {
    document.getElementById('status').textContent = 'Store unavailable: ' + e;
  }
}
document.getElementById('chSleepWeek').addEventListener('click', function (e) {
  var rect = e.target.getBoundingClientRect();
  var i = barAt('chSleepWeek', e.clientX - rect.left);
  if (i >= 0) { drawWeek(i); showNight(i); }
});
render();
</script>
<nav class="tabs">
<a href="index.html">Dashboard</a>
<a href="activity.html">Activity</a>
<a href="sleep.html" aria-current="page">Sleep</a>
<a href="workout.html">Workouts</a>
<a href="watch.html">Watch</a>
<a href="pull.html">Pull</a>
</nav>
</body>
</html>
