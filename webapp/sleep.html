<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ID208 Sleep</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<h1>Sleep</h1>
<p><span id="status" class="muted"></span></p>

<section id="secLast" hidden>
  <h2><span id="lastTitle">Last night</span> <span id="lastDate" class="muted"></span></h2>
  <div id="lastDetail"></div>
</section>

<section id="secWeek">
  <h2>Week</h2>
  <p class="pager">
    <button id="btnPrevW" title="Previous week" aria-label="Previous week">‹</button>
    <span id="weekLabel" class="month-label"></span>
    <button id="btnNextW" title="Next week" aria-label="Next week">›</button>
  </p>
  <div class="chart-legend"><span><i class="swatch deep"></i>deep</span>
  <span><i class="swatch rem"></i>REM</span>
  <span><i class="swatch light"></i>light</span>
  <span><i class="swatch awake"></i>awake</span></div>
  <canvas id="chSleepWeek"></canvas>
  <div id="nightDetail" class="muted">Tap a bar above.</div>
  <div id="sleepAvg" class="muted"></div>
</section>

<section id="secMonth">
  <h2>History</h2>
  <p><button id="btnPrevM" title="Previous month" aria-label="Previous month">‹</button>
  <span id="monthLabel" class="month-label"></span>
  <button id="btnNextM" title="Next month" aria-label="Next month">›</button></p>
  <canvas id="chMonth"></canvas>
  <h3>Sleep calendar</h3>
  <div id="monthHeatmap" class="heatmap-grid" aria-label="Monthly sleep calendar"></div>
  <div id="monthSummary" class="muted"></div>
  <div id="nightList"></div>
</section>
<script>
// Cache-bust every local script when the page has ?v=<epoch> (see index.html).
(function () {
  var m = location.search.match(/[?&]v=([^&]+)/);
  var q = m ? '?v=' + m[1] : '';
  ['shell.js', 'store.js', 'ui.js'].forEach(function (f) {
    document.write('<script src="' + f + q + '"><\/script>');
  });
})();
</script>
<script>
// Fail fast on file skew (see index.html): banner + fresh reload instead of silent hang.
(function checkAppFiles() {
  var need = ['Store', 'stackedBarChart', 'barChart', 'barAt', 'esc', 'num', 'fmtHM',
    'monthKey', 'addMonths', 'daysInMonth', 'weeksOf', 'mondayOf', 'addDays', 'sleepScore',
    'wireMonthNav', 'isoWeek', 'todayStr', 'dayDiff', 'nightInProgress', 'parseDay', 'pad2', 'uiColor', 'emptyStateHTML'];
  IDO.shell.checkFiles(need);
})();

var ALL = [], NIGHTS = [], SEL = null, CUR = null, DAYS = [], PICKED = null;
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
  'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var WDAY = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

function shortDate(ds) { return parseDay(ds).getDate() + ' ' + MON[parseDay(ds).getMonth()]; }
function dateLabel(ds) {
  var d = parseDay(ds);
  return WDAY[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()];
}
function timeOf(stamp) {
  var p = String(stamp || '').split(' ');
  return p.length > 1 ? p[1] : '—';
}
function stampIso(stamp) {
  var m = /^(\d{4})-(\d{1,2})-(\d{1,2})\s+(\d{1,2}):(\d{2})$/.exec(String(stamp || ''));
  if (!m) return '';
  return m[1] + '-' + pad2(m[2]) + '-' + pad2(m[3]);
}
function partsOf(n) {
  return [
    { v: Number(n.deep_min) || 0, color: uiColor('--sleep-deep', '#3156b8'), name: 'deep' },
    { v: Number(n.rem_min) || 0, color: uiColor('--sleep-rem', '#8857c7'), name: 'REM' },
    { v: Number(n.light_min) || 0, color: uiColor('--sleep-light', '#70a9df'), name: 'light' },
    { v: Number(n.wake_min) || 0, color: uiColor('--sleep-wake', '#aab4c2'), name: 'awake' },
  ];
}
function stageBar(n) {
  var total = Number(n.total_min) || 0;
  if (!total) return '';
  return '<div class="stagebar">' + partsOf(n).map(function (p) {
    var w = 100 * p.v / total;
    return w > 0 ? '<span style="width:' + w.toFixed(2) + '%;background:' +
      p.color + '"></span>' : '';
  }).join('') + '</div>';
}
function miniBar(n) {
  var total = Number(n.total_min) || 0;
  if (!total) return '';
  return '<span class="nr-mini">' + partsOf(n).map(function (p) {
    var w = 100 * p.v / total;
    return w > 0 ? '<span style="width:' + w.toFixed(2) + '%;background:' +
      p.color + '"></span>' : '';
  }).join('') + '</span>';
}
function ratingLine(n) {
  var r = sleepScore(n);
  if (!r) return '';
  return '<div class="rating r-' + r.label.toLowerCase() + '">Rating: ' +
    esc(r.label) + ' (' + r.score + ')</div>' +
    '<div class="muted">deep ' + r.deepPct + '% · REM ' + r.remPct + '% · light ' + r.lightPct + '%</div>';
}
function nightHTML(n) {
  var prog = nightInProgress(n);
  var total = Number(n.total_min) || 0;
  var bed = timeOf(n.fall_asleep), wake = timeOf(n.get_up);
  var bedDate = dateLabel(n.night);
  var wakeIso = stampIso(n.get_up);
  var wakeDate = wakeIso ? dateLabel(wakeIso) : '';
  var when = esc(bedDate) + (wakeDate && wakeDate !== bedDate ? ' → ' + esc(wakeDate) : '');
  var html = '<div class="big">' + (prog && !total ? 'In progress' : esc(fmtHM(total))) + '</div>' +
    (prog ? '<span class="badge">in progress</span>' : '') +
    '<div class="muted">' + esc(bed) + ' → ' + esc(wake) + '</div>' +
    '<div class="muted">' + when + '</div>';
  if (prog) html += '<div class="muted">Still recording — sync again after you wake.</div>';
  if (!total) return html;
  // A rating on a partial night is misleading; keep the stage numbers only.
  return html + stageBar(n) + (prog ? '' : ratingLine(n)) +
    '<div class="stats">' +
    '<div><div class="k">Awake</div><div class="v">' + esc(fmtHM(n.wake_min)) + '</div></div>' +
    '<div><div class="k">Light</div><div class="v">' + esc(fmtHM(n.light_min)) + '</div></div>' +
    '<div><div class="k">REM</div><div class="v">' + esc(fmtHM(n.rem_min)) + '</div></div>' +
    '<div><div class="k">Deep</div><div class="v">' + esc(fmtHM(n.deep_min)) + '</div></div>' +
    '</div>';
}
function renderLast() {
  var sec = document.getElementById('secLast');
  if (!ALL.length) { sec.hidden = true; return; }
  var n = ALL[ALL.length - 1].payload;
  var fresh = dayDiff(n.night, todayStr()) <= 1;
  sec.hidden = false;
  document.getElementById('lastTitle').textContent = fresh ? 'Last night' : 'Latest night';
  document.getElementById('lastDate').textContent = '· ' + dateLabel(n.night);
  document.getElementById('lastDetail').innerHTML = nightHTML(n);
}
function inWeek(r) { return r.payload.night >= SEL.start && r.payload.night <= SEL.end; }
function showNight(i) {
  document.getElementById('nightDetail').innerHTML = nightHTML(NIGHTS[i].payload);
}
function showDay(ds) {
  for (var i = 0; i < NIGHTS.length; i++) {
    if (NIGHTS[i].payload.night === ds) { showNight(i); return; }
  }
  document.getElementById('nightDetail').innerHTML = emptyStateHTML('No sleep data for ' + ds, 'Tap a filled bar or choose another night.');
}
function drawSelected(selDate, showDetail) {
  // Always 7 Mon–Sun columns; missing days draw flat instead of stretching the rest.
  var map = {};
  ALL.forEach(function (r) { map[r.payload.night] = r.payload; });
  DAYS = [];
  for (var i = 0; i < 7; i++) DAYS.push(addDays(SEL.start, i));
  PICKED = selDate;
  var selIdx = DAYS.indexOf(selDate);
  if (selIdx < 0) selIdx = DAYS.length - 1;
  stackedBarChart('chSleepWeek', DAYS.map(function (ds) {
    var p = map[ds] || {};
    var total = Number(p.total_min) || 0;
    var prog = p.night ? nightInProgress(p) : false;
    var txt = '';
    if (p.night) txt = prog ? (total ? fmtHM(total) + '…' : '…') : fmtHM(total);
    return { label: ds.slice(5), total: total, parts: partsOf(p), totalText: txt };
  }), showDetail === false ? -1 : selIdx);
  if (!ALL.length) {
    document.getElementById('nightDetail').innerHTML = emptyStateHTML('No sleep data this week', 'Sync the watch to add sleep history.');
  } else if (showDetail === false) {
    document.getElementById('nightDetail').textContent = 'Tap a bar above.';
  } else {
    showDay(DAYS[selIdx]);
  }
  var total = 0, count = 0;
  NIGHTS.forEach(function (r) {
    var v = Number(r.payload.total_min) || 0;
    if (v > 0 && !nightInProgress(r.payload)) { total += v; count++; }
  });
  document.getElementById('sleepAvg').textContent = count ?
    'Week ' + shortDate(SEL.start) + ' – ' + shortDate(SEL.end) +
    ' · avg ' + fmtHM(Math.round(total / count)) + '/night (' + count + ' nights).' :
    'No completed nights in week ' + shortDate(SEL.start) + ' – ' +
    shortDate(SEL.end) + '.';
}
function selectWeek(selDate, showDetail) {
  document.getElementById('weekLabel').textContent =
    shortDate(SEL.start) + ' – ' + shortDate(SEL.end);
  NIGHTS = ALL.filter(inWeek);
  var pick = selDate;
  if (!pick || pick < SEL.start || pick > SEL.end) {
    pick = NIGHTS.length ? NIGHTS[NIGHTS.length - 1].payload.night : SEL.end;
  }
  drawSelected(pick, showDetail);
}
function nightRowHTML(n) {
  var prog = nightInProgress(n);
  var total = Number(n.total_min) || 0;
  return '<button class="nightrow' + (prog ? ' inprog' : '') + '" data-night="' +
    esc(n.night) + '">' +
    '<span class="nr-top"><span>' + esc(dateLabel(n.night)) + '</span><span>' +
    (prog && !total ? 'in progress' : esc(fmtHM(total))) +
    (prog && total ? ' · so far' : '') + '</span></span>' +
    '<span class="nr-sub">' + esc(timeOf(n.fall_asleep)) + ' → ' +
    esc(timeOf(n.get_up)) + '</span>' + miniBar(n) + '</button>';
}
function renderMonth() {
  document.getElementById('monthLabel').textContent = CUR;
  var map = {};
  ALL.forEach(function (r) { map[r.payload.night] = r.payload; });
  var n = daysInMonth(CUR), values = [];
  for (var d = 1; d <= n; d++) {
    var ds = CUR + '-' + String(d).padStart(2, '0');
    values.push((map[ds] && Number(map[ds].total_min)) || 0);
  }
  barChart('chMonth', values.map(function (_, i) { return String(i + 1); }), values, {
    labelEvery: 5, left: 42, yFormat: function (minutes) { return (minutes / 60).toFixed(1) + 'h'; },
  });
  var firstOffset = (parseDay(CUR + '-01').getDay() + 6) % 7;
  var heat = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(function (d) {
    return '<span class="heatmap-head">' + d + '</span>';
  }).join('');
  for (var pad = 0; pad < firstOffset; pad++) heat += '<span class="heatmap-blank" aria-hidden="true"></span>';
  for (var day = 1; day <= n; day++) {
    var heatDate = CUR + '-' + String(day).padStart(2, '0'), night = map[heatDate];
    var mins = night ? Number(night.total_min) || 0 : 0;
    var level = mins >= 480 ? 4 : mins >= 420 ? 3 : mins >= 300 ? 2 : mins > 0 ? 1 : 0;
    var heatSelected = heatDate === PICKED ? ' selected' : '';
    heat += '<button type="button" class="heatmap-day' + heatSelected + '" data-night="' + heatDate + '" data-level="' + level + '" aria-pressed="' + (heatDate === PICKED) + '" aria-label="' +
      esc(heatDate + (night ? ': ' + fmtHM(mins) : ': no sleep data')) + '"><span>' + day + '</span>' +
      (mins ? '<span class="heat-hours">' + Math.floor(mins / 60) + 'h</span>' : '') + '</button>';
  }
  var cellsUsed = firstOffset + n;
  while (cellsUsed % 7) { heat += '<span class="heatmap-blank" aria-hidden="true"></span>'; cellsUsed++; }
  document.getElementById('monthHeatmap').innerHTML = heat;
  var nights = ALL.filter(function (r) {
    return monthKey(r.payload.night) === CUR;
  }).slice().reverse();
  var total = 0, count = 0, partials = 0;
  nights.forEach(function (r) {
    var v = Number(r.payload.total_min) || 0;
    if (nightInProgress(r.payload)) { partials++; return; }
    if (v > 0) { total += v; count++; }
  });
  document.getElementById('monthSummary').textContent = nights.length ?
    nights.length + ' night(s)' + (partials ? ' · ' + partials + ' in progress' : '') +
    (count ? ' · avg ' + fmtHM(Math.round(total / count)) + '/night' : '') : 'No nights in ' + CUR + '.';
  document.getElementById('nightList').innerHTML = nights.length ?
    nights.map(function (r) { return nightRowHTML(r.payload); }).join('') :
    emptyStateHTML('No nights in ' + CUR, 'Sleep history will appear after a sync.');
}
function selectNight(ds) {
  SEL = { start: mondayOf(ds), end: addDays(mondayOf(ds), 6) };
  CUR = monthKey(ds);
  selectWeek(ds, true);
  renderMonth();
  var sec = document.getElementById('secWeek');
  if (sec.scrollIntoView) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
document.getElementById('nightList').addEventListener('click', function (e) {
  var btn = e.target.closest && e.target.closest('.nightrow');
  if (btn) selectNight(btn.getAttribute('data-night'));
});
document.getElementById('monthHeatmap').addEventListener('click', function (e) {
  var btn = e.target.closest && e.target.closest('.heatmap-day');
  if (btn) {
    document.querySelectorAll('.heatmap-day').forEach(function (day) { day.setAttribute('aria-pressed', 'false'); day.classList.remove('selected'); });
    btn.setAttribute('aria-pressed', 'true');
    selectNight(btn.getAttribute('data-night'));
  }
});
async function render() {
  try {
    var sleep = await Store.list('sleep');
    ALL = sleep;
    var latest = ALL.length ? ALL[ALL.length - 1].payload.night : todayStr();
    CUR = monthKey(latest);
    SEL = { start: mondayOf(latest), end: addDays(mondayOf(latest), 6) };
    renderLast();
    selectWeek(undefined, false);
    renderMonth();
    document.getElementById('status').textContent = ALL.length ?
      ALL.length + ' nights in store.' : 'No sleep data yet — run a sync.';
  } catch (e) {
    document.getElementById('status').textContent = 'Store unavailable: ' + e;
  }
}
document.getElementById('btnPrevW').addEventListener('click', function () {
  SEL = { start: addDays(SEL.start, -7), end: addDays(SEL.end, -7) };
  CUR = monthKey(SEL.start);
  selectWeek(undefined, true);
  renderMonth();
});
document.getElementById('btnNextW').addEventListener('click', function () {
  SEL = { start: addDays(SEL.start, 7), end: addDays(SEL.end, 7) };
  CUR = monthKey(SEL.start);
  selectWeek(undefined, true);
  renderMonth();
});
wireMonthNav(function (n) {
  CUR = addMonths(CUR, n);
  var nights = ALL.filter(function (r) { return monthKey(r.payload.night) === CUR; });
  var anchor = nights.length ? nights[nights.length - 1].payload.night : CUR + '-01';
  SEL = { start: mondayOf(anchor), end: addDays(mondayOf(anchor), 6) };
  selectWeek(anchor, false);
  renderMonth();
});
document.getElementById('chSleepWeek').addEventListener('click', function (e) {
  var rect = e.target.getBoundingClientRect();
  var i = barAt('chSleepWeek', e.clientX - rect.left);
  if (i >= 0) showDay(DAYS[i]);
});
render();
</script>
<nav class="tabs"></nav>
</body>
</html>
